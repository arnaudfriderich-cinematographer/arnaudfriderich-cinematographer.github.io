<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Arnaud Friderich — Cinematographer</title>
  <meta name="description" content="Arnaud Friderich, directeur de la photographie. Commercial, Narrative, Art Film.">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="Arnaud Friderich — Cinematographer">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://arnaudfriderich.com/">
  <meta property="og:image" content="https://arnaudfriderich.com/media/posters/lancome-community.jpg">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..700&family=Inter+Tight:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#films">Aller aux films</a>

  <!-- En-tête façon Apicorp, menu déroulant façon Apple -->
  <header class="nav" id="nav">
    <div class="nav-bar">
      <a class="nav-name" href="#top" data-home>
        <span data-name></span>
        <span class="nav-tagline" data-tagline></span>
      </a>
      <button class="nav-burger" id="nav-burger" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="flyout">
        <span></span><span></span>
      </button>
    </div>

    <div class="flyout" id="flyout" aria-hidden="true">
      <nav class="flyout-inner" id="flyout-inner" aria-label="Menu"></nav>
    </div>
  </header>
  <div class="scrim" id="scrim" aria-hidden="true"></div>

  <main id="top">
    <!-- Films : grille pleine largeur façon Apicorp -->
    <section class="work" id="films" aria-label="Films">
      <div class="grid" id="grid"></div>
      <div class="grid-foot" id="grid-foot" hidden>
        <button class="grid-all" id="grid-all" type="button">Voir tous les films</button>
      </div>
    </section>

    <!-- Réalisateurs, clients, contact -->
    <section class="info" id="infos" aria-label="Réalisateurs, clients et contact">
      <div class="info-cols">
        <div class="info-col">
          <h3>Réalisateurs</h3>
          <ul id="info-directors"></ul>
        </div>
        <div class="info-col">
          <h3>Clients</h3>
          <ul id="info-clients"></ul>
        </div>
        <div class="info-col" id="contact">
          <h3>Contact</h3>
          <ul id="info-contact"></ul>
        </div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span>© <span id="year"></span> <span data-name></span></span>
    <a href="#top" class="foot-top">Haut de page
      <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 8L6 4.5 9.5 8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </footer>

  <!-- Lecteur : fenêtre qui monte depuis le bas, façon Apple -->
  <div class="player" id="player" aria-hidden="true">
    <div class="player-backdrop" data-close></div>
    <div class="player-window" role="dialog" aria-modal="true" aria-labelledby="player-title">
      <button class="round-btn player-close" data-close aria-label="Fermer">
        <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <div class="player-stage" id="player-stage">
        <video class="player-video" id="player-video" playsinline preload="auto"></video>
        <button class="player-bigplay" id="player-bigplay" aria-label="Lecture">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
        </button>
        <div class="player-controls" id="player-controls">
          <button class="ctrl" id="ctrl-play" aria-label="Pause">
            <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg>
            <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
          </button>
          <span class="ctrl-time" id="ctrl-time">0:00</span>
          <input class="ctrl-seek" id="ctrl-seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Position de lecture">
          <span class="ctrl-time" id="ctrl-dur">0:00</span>
          <button class="ctrl" id="ctrl-mute" aria-label="Couper le son">
            <svg class="i-sound" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 010 6M18 6.5a7.7 7.7 0 010 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <svg class="i-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <button class="ctrl" id="ctrl-fs" aria-label="Plein écran">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9V4.5H9M15 4.5h4.5V9M19.5 15v4.5H15M9 19.5H4.5V15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <div class="player-info">
        <div class="player-meta">
          <p class="player-cat" id="player-cat"></p>
          <h2 class="player-title condensed" id="player-title"></h2>
          <p class="player-dir" id="player-dir"></p>
        </div>
        <div class="player-nav">
          <button class="round-btn" id="player-prev" aria-label="Film précédent">
            <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M8.5 3L4.5 7l4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="round-btn" id="player-next" aria-label="Film suivant">
            <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M5.5 3l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
